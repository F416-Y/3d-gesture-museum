<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg{fill:#f3efe5}.panel{fill:#fbfaf5;stroke:#b9ad98;stroke-width:2}.wall{fill:#d9cdb9;stroke:#665746;stroke-width:3}.hall{fill:#6d5544;stroke:#3f3026;stroke-width:3}.water{fill:#82b8c2;stroke:#397c87;stroke-width:3}.path{fill:none;stroke:#cba968;stroke-width:12;stroke-linecap:round;stroke-dasharray:2 20}.corridor{fill:#b38a61;stroke:#604833;stroke-width:2}.tree{fill:#6f9360;stroke:#3e6240;stroke-width:2}.label{font:700 24px sans-serif;fill:#3c3329}.small{font:16px sans-serif;fill:#584b3d}.dim{font:14px sans-serif;fill:#76563f}.title{font:700 32px sans-serif;fill:#332a22}.sub{font:16px sans-serif;fill:#6a5b4b}
    </style>
  </defs>
  <rect width="1500" height="980" class="bg"/>
  <text x="70" y="55" class="title">云间入墨 · 展厅院落放大示意图</text>
  <text x="70" y="83" class="sub">仅调整院落整体外观比例；展厅坐标、模型零件和入口方向保持不变</text>
  <g transform="translate(55,120)">
    <rect width="430" height="360" rx="16" class="panel"/><text x="22" y="38" class="label">山水院 · 17.5 × 15 m</text>
    <rect x="42" y="70" width="346" height="250" class="wall"/><rect x="212" y="70" width="176" height="62" class="hall"/><text x="272" y="108" fill="#fff" class="small">山水展厅</text>
    <path d="M80 270 C125 215 135 170 198 150 S292 170 350 125" class="path"/><circle cx="105" cy="125" r="25" class="tree"/><circle cx="330" cy="260" r="30" class="tree"/><rect x="40" y="168" width="18" height="90" class="corridor"/><text x="60" y="345" class="dim">东门接花鸟左侧门 · 院内留宽通行面</text>
  </g>
  <g transform="translate(535,120)">
    <rect width="430" height="360" rx="16" class="panel"/><text x="22" y="38" class="label">花鸟院 · 22 × 16.5 m</text>
    <rect x="42" y="70" width="346" height="250" class="wall"/><rect x="132" y="70" width="166" height="68" class="hall"/><text x="184" y="111" fill="#fff" class="small">花鸟展厅</text>
    <path d="M70 285 C125 240 110 180 180 165 S300 205 360 260" class="path"/><rect x="42" y="162" width="18" height="70" class="corridor"/><rect x="370" y="162" width="18" height="70" class="corridor"/><ellipse cx="214" cy="230" rx="72" ry="40" class="water"/><circle cx="90" cy="95" r="24" class="tree"/><circle cx="340" cy="95" r="24" class="tree"/><text x="62" y="345" class="dim">左右侧门分别接山水、人物；中央留景观水面</text>
  </g>
  <g transform="translate(1015,120)">
    <rect width="430" height="360" rx="16" class="panel"/><text x="22" y="38" class="label">人物院 · 17.5 × 11 m</text>
    <rect x="42" y="70" width="346" height="250" class="wall"/><rect x="130" y="70" width="172" height="62" class="hall"/><text x="190" y="108" fill="#fff" class="small">人物展厅</text>
    <path d="M70 272 C145 215 175 168 238 184 S320 235 360 275" class="path"/><rect x="42" y="160" width="18" height="70" class="corridor"/><rect x="202" y="70" width="52" height="16" class="corridor"/><circle cx="88" cy="100" r="25" class="tree"/><circle cx="340" cy="250" r="28" class="tree"/><text x="58" y="345" class="dim">上方门接花鸟右侧；下方门接书斋上方</text>
  </g>
  <g transform="translate(55,550)">
    <rect width="430" height="360" rx="16" class="panel"/><text x="22" y="38" class="label">文创·临摹院 · 11 × 27 m</text>
    <rect x="42" y="70" width="346" height="250" class="wall"/><rect x="42" y="132" width="78" height="126" class="hall"/><text x="53" y="198" fill="#fff" class="small">文创·临摹</text>
    <path d="M140 94 C195 145 205 220 340 278" class="path"/><rect x="370" y="170" width="18" height="70" class="corridor"/><circle cx="300" cy="110" r="27" class="tree"/><circle cx="300" cy="275" r="26" class="tree"/><text x="58" y="345" class="dim">序厅连廊接南侧；上方门接山水方向</text>
  </g>
  <g transform="translate(535,550)">
    <rect width="430" height="360" rx="16" class="panel"/><text x="22" y="38" class="label">书斋·茶室院 · 8 × 26 m</text>
    <rect x="42" y="70" width="346" height="250" class="wall"/><rect x="310" y="70" width="78" height="104" class="hall"/><rect x="310" y="216" width="78" height="104" class="hall"/><text x="326" y="128" fill="#fff" class="small">书斋</text><text x="326" y="273" fill="#fff" class="small">茶室</text>
    <path d="M70 110 C140 155 170 190 260 205 S320 255 290 300" class="path"/><rect x="42" y="165" width="18" height="70" class="corridor"/><circle cx="130" cy="100" r="25" class="tree"/><circle cx="170" cy="285" r="28" class="tree"/><text x="58" y="345" class="dim">序厅东侧连廊进入；书斋上方门作为回游出口</text>
  </g>
  <g transform="translate(1015,550)">
    <rect width="430" height="360" rx="16" class="panel"/><text x="22" y="38" class="label">中央庭院 · 统一水院与环形连廊</text>
    <rect x="42" y="70" width="346" height="250" class="wall"/><ellipse cx="215" cy="195" rx="118" ry="78" class="water"/><rect x="42" y="70" width="346" height="18" class="corridor"/><rect x="42" y="302" width="346" height="18" class="corridor"/><rect x="42" y="70" width="18" height="250" class="corridor"/><rect x="370" y="70" width="18" height="250" class="corridor"/><path d="M215 302 L250 275 L205 245 L235 210 L190 178 L215 140 L215 88" class="path"/><circle cx="95" cy="125" r="25" class="tree"/><circle cx="335" cy="125" r="25" class="tree"/><circle cx="95" cy="270" r="25" class="tree"/><circle cx="335" cy="270" r="25" class="tree"/><text x="58" y="345" class="dim">序厅—花鸟弯桥贯穿中央水面，四周形成环形游线</text>
  </g>
</svg>
