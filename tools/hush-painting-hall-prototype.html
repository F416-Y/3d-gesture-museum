<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>云间入墨 · Hush 纯绘画厅初稿</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #11100f; font-family: "Microsoft YaHei", sans-serif; }
    #stage { position: fixed; inset: 0; }
    .hud { position: fixed; z-index: 2; left: 28px; top: 24px; color: #f4eee5; pointer-events: none; }
    .eyebrow { margin: 0 0 8px; color: #c49a72; font-size: 12px; letter-spacing: .22em; }
    h1 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: .12em; }
    .note { position: fixed; z-index: 2; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 16px; border: 1px solid rgba(255,255,255,.15); border-radius: 999px; color: rgba(255,255,255,.72); background: rgba(20,18,16,.52); backdrop-filter: blur(12px); font-size: 12px; }
    .badge { position: fixed; z-index: 2; right: 28px; top: 24px; color: rgba(255,255,255,.6); font-size: 12px; letter-spacing: .12em; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="hud"><p class="eyebrow">CLOUDINK · FIRST DRAFT</p><h1>山水 · 纯绘画厅</h1></div>
  <div class="badge">HUSH-INSPIRED / PAINTING ONLY</div>
  <div class="note">拖拽环视　·　滚轮靠近作品　·　作品保持唯一视觉主体</div>
  <script src="../js/vendor/three.min.js"></script>
  <script>
    (function () {
      var stage = document.getElementById('stage');
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x171513);
      scene.fog = new THREE.Fog(0x171513, 16, 34);
      var camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .1, 80);
      camera.position.set(0, 2.2, 8.2);
      var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      stage.appendChild(renderer.domElement);

      var gallery = new THREE.Group();
      scene.add(gallery);
      var wall = new THREE.MeshStandardMaterial({ color: 0xe9e2d7, roughness: .92 });
      var floorMat = new THREE.MeshStandardMaterial({ color: 0x5a5148, roughness: .86 });
      var trim = new THREE.MeshStandardMaterial({ color: 0x26211d, roughness: .65 });
      function box(w, h, d, x, y, z, mat) {
        var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z); m.receiveShadow = true; gallery.add(m); return m;
      }
      box(18, .18, 14, 0, 0, 0, floorMat);
      box(18, 7, .18, 0, 3.5, -7, wall);
      box(.18, 7, 14, -9, 3.5, 0, wall);
      box(.18, 7, 14, 9, 3.5, 0, wall);
      box(18, .18, 14, 0, 7, 0, wall);
      box(18, .08, .08, 0, .36, -6.86, trim);

      var paintings = [
        ['../assets/images/fuchunshanjv.jpg', -4.25, 2.75, 3.0, 3.9],
        ['../assets/images/qianlijiangshan.jpg', 0, 2.9, 4.8, 3.05],
        ['../assets/images/xishanxinglvtu.jpg', 4.25, 2.75, 3.0, 3.9]
      ];
      var loader = new THREE.TextureLoader();
      paintings.forEach(function (p, index) {
        loader.load(p[0], function (texture) {
          texture.encoding = THREE.sRGBEncoding;
          var frame = new THREE.Mesh(new THREE.BoxGeometry(p[3] + .18, p[4] + .18, .12), trim);
          frame.position.set(p[1], p[2], -6.72); frame.castShadow = true; gallery.add(frame);
          var art = new THREE.Mesh(new THREE.PlaneGeometry(p[3], p[4]), new THREE.MeshStandardMaterial({ map: texture, roughness: .72 }));
          art.position.set(p[1], p[2], -6.64); gallery.add(art);
          var label = box(.95, .04, .16, p[1], .58, -6.57, trim); label.scale.x = index === 1 ? 1.5 : 1;
        });
      });

      scene.add(new THREE.HemisphereLight(0xfff4e4, 0x241d18, 1.25));
      function wash(x) {
        var light = new THREE.SpotLight(0xffd9b0, 4.2, 12, Math.PI / 7, .72, 1.2);
        light.position.set(x, 6.2, -3.8); light.target.position.set(x, 2.6, -6.6);
        light.castShadow = true; scene.add(light, light.target);
      }
      wash(-4.25); wash(0); wash(4.25);

      var yaw = 0, pitch = -.06, distance = 8.2, dragging = false, px = 0, py = 0;
      function updateCamera() {
        camera.position.set(Math.sin(yaw) * distance, 2.25 + pitch * 3, Math.cos(yaw) * distance);
        camera.lookAt(0, 2.6, -2.8);
      }
      renderer.domElement.addEventListener('pointerdown', function (e) { dragging = true; px = e.clientX; py = e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
      renderer.domElement.addEventListener('pointermove', function (e) { if (!dragging) return; yaw -= (e.clientX - px) * .004; pitch = Math.max(-.45, Math.min(.35, pitch + (e.clientY - py) * .002)); px = e.clientX; py = e.clientY; updateCamera(); });
      renderer.domElement.addEventListener('pointerup', function () { dragging = false; });
      renderer.domElement.addEventListener('wheel', function (e) { distance = Math.max(4.2, Math.min(13, distance + e.deltaY * .006)); updateCamera(); }, { passive: true });
      addEventListener('resize', function () { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
      updateCamera();
      (function render() { requestAnimationFrame(render); renderer.render(scene, camera); })();
    }());
  </script>
</body>
</html>
