name: CI

# 什么时候跑：向 main 提 PR 时、main 被更新后、以及手动触发
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 引擎冒烟测试 + 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 引擎脚本语法检查（js/*.js）
        run: |
          for f in js/*.js; do
            echo "check $f"
            node --check "$f"
          done
      - name: 场景冒烟测试（真实执行 scene.js 的 init）
        run: node scripts/smoke-scene.mjs
      - name: 展品热点与弹窗全量验收
        run: npm run verify:exhibits

  build:
    name: 生产构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 构建产物完整性
        run: |
          test -f dist/index.html
          test -f dist/js/scene.js
          test -f dist/css/style.css
          test -d dist/assets
          echo "产物检查通过"

  guards:
    name: 安全与体积守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 密钥扫描（提交内容里不能出现 token / 私钥）
        run: |
          # 排除 .github 自身（规则文本本身就包含这些关键字）
          if grep -rnE "eyJhbGciOi|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|BEGIN [A-Z ]*PRIVATE KEY|service_role" \
               --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::发现疑似密钥或令牌，请立即移除并轮换"
            exit 1
          fi
          echo "密钥扫描通过"
      - name: 大文件守卫（单个跟踪文件不超过 5MB）
        run: |
          # 例外（2026-10-09 放行）：MediaPipe 离线推理要把 wasm 与手部模型随仓库分发（Apache-2.0），
          # 这 3 个文件天然 >5MB；其余文件仍严格受 5MB 限制。
          ALLOW='^(js/vendor/mediapipe/|assets/models/hand_landmarker\.task$)'
          big=""
          allow_cnt=0
          lfs_cnt=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if printf '%s' "$f" | grep -Eq "$ALLOW"; then allow_cnt=$((allow_cnt + 1)); continue; fi
            # LFS 文件已在传输层单独管理，不再按工作区实体大小重复拦截
            if git check-attr filter -- "$f" | grep -q 'filter: lfs'; then lfs_cnt=$((lfs_cnt + 1)); continue; fi
            s=$(wc -c < "$f")
            if [ "$s" -gt 5242880 ]; then
              big="$big"$'\n'"  $f ($((s / 1024))KB)"
            fi
          done < <(git ls-files)
          echo "白名单放行 $allow_cnt 个文件（MediaPipe 离线件）；LFS 托管放行 $lfs_cnt 个文件"
          if [ -n "$big" ]; then
            echo "::error::以下文件超过 5MB，请压缩或启用 Git LFS"
            echo "$big"
            exit 1
          fi
          echo "体积检查通过"
