name: Exhibit Model Viewer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - js/ui.js
      - css/style.css
      - scripts/verify-exhibit-model-fit.mjs
      - .github/workflows/exhibit-model-viewer.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装项目依赖
        run: npm ci
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 构建生产页面
        run: npm run build
      - name: 浏览器验收展品模型自动取景
        run: node scripts/verify-exhibit-model-fit.mjs
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: 上传验收截图
        uses: actions/upload-artifact@v4
        with:
          name: exhibit-model-autofit
          path: docs/current/组员5-截图/组员5-12-展品模型完整取景.png
          if-no-files-found: error
