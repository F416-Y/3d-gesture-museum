    list.innerHTML = "";
    ITEMS.forEach(function (item) {
      var b = document.createElement("button"); b.type = "button"; b.className = "exhibit-button" + (item.id === selected ? " active" : ""); b.dataset.view = item.id;
      b.innerHTML = '<span class="num">' + item.number + '</span><span>' + item.label + '</span><span class="meta">' + item.meta + '</span>';
      b.addEventListener("click", function () { focus(item.id); }); list.appendChild(b);
    });
  }
  function setCaption(id) {
    var item = ITEMS.filter(function (x) { return x.id === id; })[0] || ITEMS[0]; selected = item.id; captionTitle.textContent = item.title; captionText.textContent = item.text;
    Array.prototype.forEach.call(list.children, function (b) { b.classList.toggle("active", b.dataset.view === item.id); });
  }
  function setOrbit(target, yaw, pitch, radius) {
    anim = null; view.target.set(target[0], target[1], target[2]); orbit.yaw = yaw; orbit.pitch = pitch; orbit.radius = radius; updateCamera();
  }
  function focus(id) {
    var v = VIEWS[id] || VIEWS.overall; setCaption(id);
    var fromPos = camera.position.clone(); var fromTarget = view.target.clone(); var toPos = new THREE.Vector3().fromArray(v.pos); var toTarget = new THREE.Vector3().fromArray(v.target);
    anim = { start: performance.now(), duration: 520, fromPos: fromPos, fromTarget: fromTarget, toPos: toPos, toTarget: toTarget };
  }
  function updateCamera() {
    var cp = Math.cos(orbit.pitch);
    camera.position.set(view.target.x + orbit.radius * cp * Math.sin(orbit.yaw), view.target.y + orbit.radius * Math.sin(orbit.pitch), view.target.z + orbit.radius * cp * Math.cos(orbit.yaw));
    /* 相机始终限制在人物厅内部，避免拖拽或缩放串到外景。 */
    camera.position.x = Math.max(-8.1, Math.min(8.1, camera.position.x));
    camera.position.z = Math.max(-8.1, Math.min(8.1, camera.position.z));
    camera.position.y = Math.max(0.95, Math.min(3.9, camera.position.y));
    camera.lookAt(view.target);
  }
  function tick(now) {
    requestAnimationFrame(tick);
    if (anim) {
      var k = Math.min(1, (now - anim.start) / anim.duration), e = 1 - Math.pow(1 - k, 3);
      camera.position.lerpVectors(anim.fromPos, anim.toPos, e); view.target.lerpVectors(anim.fromTarget, anim.toTarget, e); camera.lookAt(view.target);
      if (k >= 1) { orbit.yaw = Math.atan2(camera.position.x - view.target.x, camera.position.z - view.target.z); orbit.radius = camera.position.distanceTo(view.target); orbit.pitch = Math.asin((camera.position.y - view.target.y) / orbit.radius); anim = null; }
    }
    renderer.render(scene, camera);
  }
  function bindControls() {
    canvas.addEventListener("pointerdown", function (e) { anim = null; pointer = { x: e.clientX, y: e.clientY }; canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", function (e) { if (!pointer) return; var dx = e.clientX - pointer.x, dy = e.clientY - pointer.y; pointer = { x: e.clientX, y: e.clientY }; orbit.yaw -= dx * .005; orbit.pitch = Math.max(-.18, Math.min(1.12, orbit.pitch + dy * .0035)); updateCamera(); });
    function end(e) { pointer = null; canvas.classList.remove("dragging"); if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); }
    canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end);
    canvas.addEventListener("wheel", function (e) { e.preventDefault(); anim = null; orbit.radius = Math.max(3.2, Math.min(13.5, orbit.radius + e.deltaY * .006)); updateCamera(); }, { passive: false });
    document.getElementById("btn-reset").addEventListener("click", function () { focus("overall"); });
    document.getElementById("btn-back-view").addEventListener("click", function () { focus("back"); });
    window.addEventListener("resize", function () { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false); });
  }
  function init() {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false); renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    scene = new THREE.Scene(); scene.background = new THREE.Color(0xd8d0c3); scene.fog = new THREE.Fog(0xd8d0c3, 18, 42);
    camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, .03, 80); camera.rotation.order = "YXZ"; camera.position.set(0, 2.1, 7.4); camera.lookAt(view.target);
    raycaster = new THREE.Raycaster();
    scene.add(new THREE.HemisphereLight(0xfff6e8, 0x443a2e, 1.15));
    var sun = new THREE.DirectionalLight(0xffefd5, 1.45); sun.position.set(-4, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); scene.add(sun);
    var fill = new THREE.DirectionalLight(0xb8c9d2, .62); fill.position.set(5, 4, -4); scene.add(fill);
    var warm = new THREE.PointLight(0xffca8c, 1.15, 10, 1.7); warm.position.set(0, 3.8, -2.2); scene.add(warm);
    var key = new THREE.PointLight(0xffd3a2, 1.0, 6, 1.6); key.position.set(-2.8, 3.0, -1.0); scene.add(key);
    var key2 = new THREE.PointLight(0xffd3a2, .9, 6, 1.6); key2.position.set(3.0, 3.0, -1.0); scene.add(key2);
    buildRoom(); renderList(); setCaption("overall"); bindControls(); buildModels(); requestAnimationFrame(tick);
  }
  try { init(); } catch (e) { setError("页面初始化失败：" + (e && e.message ? e.message : e)); }
})();
</script>
