<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>展品三层弹窗预览 · 云间入墨</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body { margin: 0; min-height: 100vh; overflow: hidden; background: radial-gradient(circle at 50% 18%, #3a342b, #141310 72%); }
    #stage { position: fixed; inset: 0; pointer-events: none; }
    .preview-head { position: fixed; top: 22px; left: 26px; z-index: 5; color: #f2eadb; text-shadow: 0 2px 18px rgba(0,0,0,.5); }
    .preview-head b { display: block; font: 500 24px/1.3 "Kaiti SC", "STKaiti", "KaiTi", serif; }
    .preview-head span { color: rgba(242,234,219,.62); font: 11px/1.8 "Microsoft YaHei", sans-serif; letter-spacing: .05em; }
    #toast { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="preview-head">
    <b>展品三层弹窗预览</b>
    <span>基础信息 / 作品特点 / 细节赏析 · 点击画中数字查看热点</span>
  </div>
  <div id="panel" class="panel" aria-hidden="true">
    <button id="panel-close" class="panel-close" type="button" aria-label="关闭">×</button>
    <div id="panel-body" class="panel-body"></div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="./js/config.js?v=20261105-runtime2"></script>
  <script src="./js/ui.js?v=20261105-runtime2"></script>
  <script>
    window.MuseumUI.init();
    window.MuseumUI.hideLoading();
    var wuniutu = window.MuseumConfig.exhibits.find(function (item) { return item.id === "wuniutu"; });
    window.MuseumUI.showExhibit(wuniutu);
  </script>
</body>
</html>
