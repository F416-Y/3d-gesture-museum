<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171816">
  <meta name="description" content="云间入墨花鸟厅，独立 Three.js 纯画作观看空间。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23a54535'/%3E%3Cpath d='M8 9h16v2H8zm0 6h16v2H8zm0 6h16v2H8z' fill='%23f0ede2'/%3E%3C/svg%3E">
  <title>花鸟清趣 · 云间入墨</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #171816;
      --ink-soft: #23241f;
      --paper: #f0ede2;
      --paper-muted: #b9b5a9;
      --wood: #5a3d29;
      --wood-light: #8a684c;
      --cinnabar: #a54535;
      --mist-blue: #9cb0ac;
      --line: rgba(235, 230, 214, 0.2);
      --panel: rgba(20, 21, 19, 0.94);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: "Noto Serif SC", "Songti SC", "STSong", SimSun, serif;
      letter-spacing: 0;
    }

    button,
    a {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--cinnabar);
      outline-offset: 3px;
    }

    #gallery {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default;
    }

    #gallery.dragging {
      cursor: grabbing;
    }

    #gallery.art-hover {
      cursor: pointer;
    }

    .museum-ui {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .museum-ui button,
    .museum-ui a,
    .museum-ui .collection {
      pointer-events: auto;
    }

    .identity {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: max(28px, env(safe-area-inset-left));
      display: flex;
      align-items: flex-start;
      gap: 15px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    }

    .seal {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      border: 1px solid rgba(236, 220, 195, 0.7);
      background: var(--cinnabar);
      color: #f8eee1;
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 13px;
      line-height: 1.02;
      box-shadow: 0 7px 20px rgba(60, 12, 8, 0.28);
    }

    .identity-copy {
      padding-top: 1px;
    }

    .identity-kicker {
      margin: 0 0 6px;
      color: rgba(240, 237, 226, 0.65);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 10px;
      text-transform: uppercase;
    }

    .identity h1 {
      margin: 0;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
      font-size: clamp(25px, 2.5vw, 34px);
      font-weight: 500;
      line-height: 1;
    }

    .identity p {
      margin: 9px 0 0;
      color: rgba(240, 237, 226, 0.63);
      font-size: 11px;
    }

    .top-actions {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      right: max(28px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button,
    .back-link {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(240, 237, 226, 0.24);
      border-radius: 2px;
      background: rgba(21, 22, 20, 0.58);
      color: rgba(248, 244, 232, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .back-link {
      width: auto;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 11px;
      white-space: nowrap;
    }

    .icon-button:hover,
    .back-link:hover,
    .icon-button.active {
      border-color: rgba(225, 199, 161, 0.72);
      background: rgba(70, 51, 37, 0.82);
      color: #fff9eb;
    }

    .icon-button svg,
    .back-link svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .collection {
      position: absolute;
      left: max(28px, env(safe-area-inset-left));
      bottom: max(28px, env(safe-area-inset-bottom));
      width: min(300px, calc(100vw - 56px));
      padding: 16px 18px 15px;
      border-left: 1px solid rgba(226, 219, 198, 0.42);
      background: linear-gradient(90deg, rgba(18, 19, 17, 0.74), rgba(18, 19, 17, 0));
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .collection-heading {
      margin: 0 0 10px;
      color: rgba(240, 237, 226, 0.55);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
      text-transform: uppercase;
    }

    .collection-list {
      display: grid;
      gap: 1px;
    }

    .painting-button {
      position: relative;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: baseline;
      gap: 8px;
      width: 100%;
      min-height: 33px;
      padding: 6px 4px 6px 0;
      border: 0;
      background: transparent;
      text-align: left;
      color: rgba(240, 237, 226, 0.7);
      cursor: pointer;
      transition: color 150ms ease, transform 150ms ease;
    }

    .painting-button::before {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: -1px;
      width: 2px;
      background: transparent;
    }

    .painting-button:hover,
    .painting-button.active {
      color: #fffaf0;
      transform: translateX(2px);
    }

    .painting-button.active::before {
      background: #c35a47;
    }

    .painting-number {
      color: rgba(222, 199, 164, 0.6);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
    }

    .painting-name {
      font-size: 13px;
    }

    .painting-era {
      color: rgba(240, 237, 226, 0.42);
      font-size: 10px;
    }

    .reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      opacity: 0.48;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .reticle::before,
    .reticle::after {
      content: "";
      position: absolute;
      background: rgba(250, 247, 237, 0.9);
    }

    .reticle::before {
      top: 10px;
      left: 4px;
      width: 14px;
      height: 1px;
    }

    .reticle::after {
      top: 4px;
      left: 10px;
      width: 1px;
      height: 14px;
    }

    .reticle.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.18);
    }

    .reticle.active::before,
    .reticle.active::after {
      background: #d16a56;
    }

    .location {
      position: absolute;
      right: max(28px, env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      color: rgba(240, 237, 226, 0.5);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
      text-align: right;
      line-height: 1.7;
    }

    .location strong {
      display: block;
      color: rgba(242, 237, 222, 0.76);
      font-weight: 400;
    }

    .camwrap {
      position: absolute;
      right: max(28px, env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 188px;
      overflow: hidden;
      border: 1px solid rgba(234, 226, 207, 0.24);
      background: rgba(18, 19, 17, 0.86);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.28);
      pointer-events: none;
    }

    .camwrap[hidden] {
      display: none;
    }

    #cam {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transform: scaleX(-1);
      background: #111;
    }

    .camwrap p {
      margin: 0;
      padding: 8px 10px;
      color: rgba(240, 237, 226, 0.58);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
      line-height: 1.55;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 96px;
      max-width: min(480px, calc(100vw - 48px));
      padding: 9px 14px;
      transform: translate(-50%, -8px);
      border: 1px solid rgba(235, 230, 214, 0.18);
      background: rgba(20, 21, 19, 0.9);
      color: rgba(240, 237, 226, 0.82);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .art-panel {
      position: absolute;
      top: max(22px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 8;
      width: min(392px, calc(100vw - 44px));
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(227, 211, 183, 0.32);
      background:
        linear-gradient(180deg, rgba(88, 59, 39, 0.12), transparent 24%),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transform: translateX(calc(100% + 28px));
      visibility: hidden;
      transition: transform 280ms cubic-bezier(0.2, 0.78, 0.22, 1), visibility 280ms;
    }

    .art-panel.open {
      transform: translateX(0);
      visibility: visible;
    }

    .panel-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(240, 237, 226, 0.64);
      cursor: pointer;
    }

    .panel-close:hover {
      color: #fffaf0;
    }

    .panel-close svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    .panel-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 38px 34px 36px;
      scrollbar-width: thin;
      scrollbar-color: rgba(202, 185, 151, 0.35) transparent;
    }

    .panel-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 17px;
      color: #c4a77f;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
    }

    .panel-kicker::after {
      content: "";
      width: 42px;
      height: 1px;
      background: rgba(196, 167, 127, 0.44);
    }

    .panel-title {
      margin: 0;
      color: #f5efe2;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.15;
    }

    .panel-artist {
      margin: 9px 0 0;
      color: rgba(240, 237, 226, 0.58);
      font-size: 12px;
    }

    .panel-preview {
      position: relative;
      display: block;
      width: 100%;
      margin: 20px 0 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(214, 190, 148, 0.38);
      background: #11120f;
      cursor: zoom-in;
    }

    .panel-preview img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #11120f;
      transition: transform 220ms ease;
    }

    .panel-preview:hover img {
      transform: scale(1.018);
    }

    .panel-preview span {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 6px 9px;
      border: 1px solid rgba(240, 237, 226, 0.34);
      background: rgba(16, 17, 15, 0.78);
      color: rgba(248, 244, 232, 0.9);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 10px;
      pointer-events: none;
    }

    .panel-meta {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 8px 14px;
      margin: 27px 0 0;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      line-height: 1.7;
    }

    .panel-meta dt {
      color: rgba(240, 237, 226, 0.38);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
    }

    .panel-meta dd {
      margin: 0;
      color: rgba(240, 237, 226, 0.74);
    }

    .panel-copy {
      margin: 24px 0 0;
      color: rgba(240, 237, 226, 0.7);
      font-size: 13px;
      line-height: 2;
      text-align: justify;
    }

    .panel-note-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 30px 0 12px;
      color: #d7c3a4;
      font-size: 12px;
      font-weight: 500;
    }

    .panel-note-title::before {
      content: "";
      width: 5px;
      height: 5px;
      background: var(--cinnabar);
      transform: rotate(45deg);
    }

    .panel-note {
      margin: 0;
      color: rgba(240, 237, 226, 0.72);
      font-size: 13px;
      line-height: 2;
      text-align: justify;
    }

    .art-viewer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 42%, rgba(70, 75, 67, 0.2), transparent 48%),
        rgba(10, 11, 9, 0.975);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms;
    }

    .art-viewer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .viewer-topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      min-height: 58px;
      padding: 2px 0 10px;
    }

    .viewer-kicker {
      margin: 0 0 5px;
      color: rgba(214, 188, 147, 0.66);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
      text-transform: uppercase;
    }

    .viewer-title {
      margin: 0;
      color: #f5efe2;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
      font-size: clamp(20px, 2.6vw, 30px);
      font-weight: 500;
      line-height: 1.1;
    }

    .viewer-meta {
      margin: 6px 0 0;
      color: rgba(240, 237, 226, 0.48);
      font-size: 11px;
    }

    .viewer-close {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(240, 237, 226, 0.28);
      background: rgba(30, 31, 27, 0.7);
      color: rgba(248, 244, 232, 0.86);
      cursor: pointer;
    }

    .viewer-close:hover {
      border-color: rgba(225, 199, 161, 0.72);
      color: #fff9eb;
    }

    .viewer-close svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
    }

    .viewer-stage {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-top: 1px solid rgba(235, 230, 214, 0.12);
      border-bottom: 1px solid rgba(235, 230, 214, 0.12);
      touch-action: none;
      cursor: default;
    }

    .viewer-stage.zoomed {
      cursor: grab;
    }

    .viewer-stage.dragging {
      cursor: grabbing;
    }

    .viewer-image {
      display: block;
      max-width: calc(100% - 44px);
      max-height: calc(100% - 26px);
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center;
      transition: transform 180ms cubic-bezier(0.2, 0.75, 0.24, 1);
      will-change: transform;
    }

    .viewer-image.is-adjusting {
      transition: none;
    }

    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 58px;
      padding-top: 10px;
    }

    .viewer-tool {
      min-width: 42px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      padding: 0 12px;
      border: 1px solid rgba(240, 237, 226, 0.24);
      background: rgba(30, 31, 27, 0.64);
      color: rgba(248, 244, 232, 0.86);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      cursor: pointer;
    }

    .viewer-tool:hover {
      border-color: rgba(225, 199, 161, 0.7);
      background: rgba(70, 51, 37, 0.76);
      color: #fff9eb;
    }

    .viewer-zoom-value {
      min-width: 64px;
      color: rgba(240, 237, 226, 0.58);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 10px;
      text-align: center;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(76, 96, 88, 0.28), transparent 36%),
        #171816;
      transition: opacity 450ms ease, visibility 450ms;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-inner {
      width: min(330px, calc(100vw - 56px));
      text-align: center;
    }

    .loading-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid rgba(226, 207, 176, 0.62);
      color: #e5d6bf;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
      font-size: 16px;
      line-height: 1.05;
    }

    .loading h2 {
      margin: 0;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
      font-size: 24px;
      font-weight: 500;
    }

    .loading p {
      min-height: 18px;
      margin: 10px 0 20px;
      color: rgba(240, 237, 226, 0.46);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
    }

    .loading-track {
      height: 1px;
      overflow: hidden;
      background: rgba(240, 237, 226, 0.14);
    }

    .loading-bar {
      width: 4%;
      height: 100%;
      background: #b66a55;
      transition: width 300ms ease;
    }

    .load-error {
      color: #d58977 !important;
    }

    .part-caption {
      position: fixed;
      left: max(28px, env(safe-area-inset-left));
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 5;
      display: none;
      padding: 12px 0 12px 16px;
      border-left: 2px solid var(--cinnabar);
      background: linear-gradient(90deg, rgba(18, 19, 17, 0.74), transparent);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .part-mode .part-caption {
      display: block;
    }

    .part-mode .museum-ui {
      display: none;
    }

    .touch-nav {
      display: none;
    }

    .part-mode #gallery {
      cursor: grab;
    }

    .part-caption strong {
      display: block;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
      font-size: 20px;
      font-weight: 500;
    }

    .part-caption span {
      display: block;
      margin-top: 6px;
      color: rgba(240, 237, 226, 0.54);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 9px;
    }

    @media (max-width: 720px) {
      .identity {
        top: max(18px, env(safe-area-inset-top));
        left: max(18px, env(safe-area-inset-left));
      }

      .seal {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
        font-size: 11px;
      }

      .identity-kicker,
      .identity p {
        display: none;
      }

      .identity h1 {
        padding-top: 6px;
        font-size: 24px;
      }

      .top-actions {
        top: max(18px, env(safe-area-inset-top));
        right: max(18px, env(safe-area-inset-right));
      }

      .icon-button,
      .back-link {
        width: 36px;
        height: 36px;
      }

      .back-link {
        width: auto;
        padding: 0 10px;
      }

      .collection {
        left: 18px;
        right: 18px;
        bottom: max(18px, env(safe-area-inset-bottom));
        width: auto;
        padding: 12px 14px;
        background: rgba(18, 19, 17, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .collection-heading,
      .painting-era,
      .painting-number {
        display: none;
      }

      function createLabelTexture(lines, options) {
        options = options || {};
        var labelCanvas = document.createElement("canvas");
        labelCanvas.width = 1024;
        labelCanvas.height = options.tall ? 512 : 256;
        var ctx = labelCanvas.getContext("2d");
        ctx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
        if (options.background) {
          ctx.fillStyle = options.background;
          ctx.fillRect(0, 0, labelCanvas.width, labelCanvas.height);
        }
        ctx.textAlign = options.align || "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = options.color || "#2f2a23";
        var baseSize = options.fontSize || (options.tall ? 92 : 88);
        ctx.font = (options.weight || "500") + " " + baseSize + "px " + (options.font || '"Kaiti SC","STKaiti","KaiTi",serif');
        var lineHeight = baseSize * 1.18;
        var startY = labelCanvas.height / 2 - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach(function (line, index) {
          ctx.fillText(line, options.align === "left" ? 48 : labelCanvas.width / 2, startY + index * lineHeight);
        });
        if (options.seal) {
          ctx.fillStyle = "#a34132";
          ctx.fillRect(labelCanvas.width - 150, 40, 64, 64);
          ctx.fillStyle = "#f5ead9";
          ctx.font = '30px "Kaiti SC","STKaiti","KaiTi",serif';
          ctx.fillText(options.seal, labelCanvas.width - 118, 73);
        }
        var texture = new THREE.CanvasTexture(labelCanvas);
        texture.encoding = THREE.sRGBEncoding;
        texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        return texture;
      }

      function prepareModel(model) {
        model.traverse(function (object) {
          if (!object.isMesh) return;
          object.castShadow = true;
          object.receiveShadow = true;
          var meshMaterials = Array.isArray(object.material) ? object.material : [object.material];
          meshMaterials.forEach(function (material) {
            if (!material) return;
            if (material.map) material.map.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
            material.envMapIntensity = 0.4;
            material.needsUpdate = true;
          });
        });
        return model;
      }

            undefined,

        camera.far = 100;
        camera.updateProjectionMatrix();

      function updatePartCamera(maxDimension) {
        var distance = Math.max(3.2, maxDimension * (partParam === "skylight" ? 1.12 : 1.28));
        var targetY = partParam === "skylight" ? 0.12 : maxDimension * 0.48;
        camera.position.set(
          Math.sin(isolatedAngle) * distance,
          targetY + Math.sin(isolatedPitch) * distance,
          Math.cos(isolatedAngle) * distance
        );
        camera.lookAt(0, targetY, 0);
      }

      function partDistance() {
        if (!isolatedRoot) return 4;
        var box = new THREE.Box3().setFromObject(isolatedRoot);
        var size = box.getSize(new THREE.Vector3());
        var maxDimension = Math.max(size.x, size.y, size.z);
        return Math.max(3.2, maxDimension * (partParam === "skylight" ? 1.12 : 1.28));
      }

      function applyPlayerCamera(immediate) {
        var targetY = 1.68;
        var targetX = playerPosition.x;
        var targetZ = playerPosition.z;
        if (immediate || reducedMotion) {
          camera.position.set(targetX, targetY, targetZ);
        } else {
          camera.position.x += (targetX - camera.position.x) * 0.18;
          camera.position.y += (targetY - camera.position.y) * 0.18;
          camera.position.z += (targetZ - camera.position.z) * 0.18;
        }
        camera.rotation.y = playerYaw;
        camera.rotation.x = playerPitch;
        camera.rotation.z = 0;
      }

      function paintingImagePath(painting) {

      function updateViewerTransform(animate) {
        if (!viewerOpen) return;
        viewerImage.classList.toggle("is-adjusting", animate === false);
        var stageWidth = viewerStage.clientWidth || 1;
        var stageHeight = viewerStage.clientHeight || 1;
        var imageWidth = viewerImage.offsetWidth || 1;
        var imageHeight = viewerImage.offsetHeight || 1;
        var maxPanX = Math.max(0, (imageWidth * viewerZoom - stageWidth) / 2);
        var maxPanY = Math.max(0, (imageHeight * viewerZoom - stageHeight) / 2);
        viewerPanX = clamp(viewerPanX, -maxPanX, maxPanX);
        viewerPanY = clamp(viewerPanY, -maxPanY, maxPanY);
        viewerImage.style.transform =
          "translate3d(" + viewerPanX + "px," + viewerPanY + "px,0) scale(" + viewerZoom + ")";
        viewerStage.classList.toggle("zoomed", viewerZoom > 1.001);
        viewerStage.classList.toggle("dragging", !!viewerDragStart);
        viewerZoomValue.textContent = Math.round(viewerZoom * 100) + "%";
      }

      function setViewerZoom(value, animate) {
        viewerZoom = clamp(value, 1, 5);
        if (viewerZoom <= 1.001) {
          viewerZoom = 1;
          viewerPanX = 0;
          viewerPanY = 0;
        }
        updateViewerTransform(animate);
      }

      function resetViewerZoom() {
        viewerZoom = 1;
        viewerPanX = 0;
        viewerPanY = 0;
        updateViewerTransform(false);
      }

      function openArtViewer(id) {
        if (partMode) return;
        var painting = findPainting(id);
        if (!painting) return;
        viewerOpen = true;
        setActiveExhibit(id);
        viewerTitle.textContent = painting.title;
        viewerMeta.textContent = painting.artist + " · " + painting.dynasty;
        viewerImage.src = paintingImagePath(painting);
        viewerImage.alt = painting.title;
        artViewer.classList.add("open");
        artViewer.setAttribute("aria-hidden", "false");
        document.body.classList.add("viewer-open");
        viewerPointers = {};
        viewerDragStart = null;
        viewerPinchStart = null;
        viewerDidPan = false;
        resetViewerZoom();
        window.requestAnimationFrame(function () {
          resetViewerZoom();
          viewerClose.focus({ preventScroll: true });
        });

        viewerOpen = false;

      function intersectsObstacle(x, z) {
        if (x < -6.98 || x > 6.98 || z < -4.98 || z > 5.0) return true;
        var columns = [
          [-6.62, 1.95],
          [6.62, 1.95],
          [-6.62, -2.5],
          [6.62, -2.5]
        ];
        for (var i = 0; i < columns.length; i += 1) {
          var dx = x - columns[i][0];
          var dz = z - columns[i][1];
          if (dx * dx + dz * dz < 0.34 * 0.34) return true;
        }
        if (z < 1.55 && z > 0.61) {
          if ((x > -6.85 && x < -4.55) || (x > 4.55 && x < 6.85)) return true;
        }
        return false;
      }

      function updateMovement(dt) {
        if (partMode) return;
        applyPlayerCamera(false);
      }

      function raycasterFromEvent(event) {
        var rect = canvas.getBoundingClientRect();
        var pointer = new THREE.Vector2(
          ((event.clientX - rect.left) / rect.width) * 2 - 1,
          -((event.clientY - rect.top) / rect.height) * 2 + 1
        );
        var raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(pointer, camera);
        return raycaster;
      }

      function paintingAtEvent(event) {
        if (partMode) return null;
        var hits = raycasterFromEvent(event).intersectObjects(paintingMeshes, false);
        return hits.length ? hits[0].object.userData.exhibitId : null;
      }

      function onPointerDown(event) {
        if (partMode) {
          isDragging = true;
          didDrag = false;
          lastPointerX = event.clientX;
          lastPointerY = event.clientY;
          canvas.setPointerCapture(event.pointerId);
          return;
        }
        isDragging = true;
        didDrag = false;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      }

      function onPointerMove(event) {
        if (partMode) {
          if (isDragging) {
            var partDx = event.clientX - lastPointerX;
            var partDy = event.clientY - lastPointerY;
            isolatedAngle -= partDx * 0.0065;
            isolatedPitch = clamp(isolatedPitch + partDy * 0.005, -0.18, 1.05);
            lastPointerX = event.clientX;
            lastPointerY = event.clientY;
            updatePartCamera(partDistance());
          }
          return;
        }

        if (isDragging) {
          if (Math.abs(event.clientX - dragStartX) + Math.abs(event.clientY - dragStartY) > 4) {
            didDrag = true;
          }
          lastPointerX = event.clientX;
          lastPointerY = event.clientY;
          return;
        }

        var id = paintingAtEvent(event);
        hoveredId = id;
        reticle.classList.toggle("active", !!id);
        canvas.classList.toggle("art-hover", !!id);
      }

      function onPointerUp(event) {
        if (partMode) {
          isDragging = false;
          if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
          return;
        }
        var paintingId = paintingAtEvent(event);
        if (!didDrag && paintingId) {
          openPainting(paintingId);
          openArtViewer(paintingId);
        }
        isDragging = false;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      }

      async function ensureMediaPipe() {
        if (window.FilesetResolver && window.HandLandmarker) return;
        var vision = await import(/* @vite-ignore */ "./js/vendor/mediapipe/vision_bundle.js");
        window.FilesetResolver = vision.FilesetResolver;
        window.HandLandmarker = vision.HandLandmarker;
        window.MediaPipeVision = vision;
      }

      async function toggleGesture() {
        if (partMode || !window.MuseumGesture) return;
        if (gestureRunning) {
          window.MuseumGesture.stop();
          gestureRunning = false;
          camwrap.hidden = true;
          gestureButton.classList.remove("active");
          gestureButton.setAttribute("aria-label", "开启手势控制");
          showToast("手势控制已关闭");
          return;
        }
        if (gestureStarting) return;
        gestureStarting = true;
        gestureButton.classList.add("active");
        camwrap.hidden = false;
        camNote.textContent = "正在启动手势模型…";
        try {
          await ensureMediaPipe();
          await window.MuseumGesture.init(cam);
          gestureRunning = true;
          gestureTurnArmed = true;
          gestureLastSwitch = 0;
          camNote.textContent = "手势已启用 · 左右指点切画 · 捏合查看";
          gestureButton.setAttribute("aria-label", "关闭手势控制");
          showToast("手势已启用");
        } catch (error) {
          gestureRunning = false;
          camwrap.hidden = true;
          gestureButton.classList.remove("active");
          gestureButton.setAttribute("aria-label", "开启手势控制");
          showToast((error && error.hint) || "手势启动失败，请检查摄像头权限");
        } finally {
          gestureStarting = false;
        }
      }

      function handleGestureState(state, now) {
        if (partMode || !state) return;
        if (state.pinchPressed) {
          if (viewerOpen) {
            closeArtViewer();
            setPanel(false);
          } else {
            openPainting(activeExhibit);
            openArtViewer(activeExhibit);
          }
        }

        if (Math.abs(state.turn) < 0.16) gestureTurnArmed = true;
        if (gestureTurnArmed && Math.abs(state.turn) > 0.46 && now - gestureLastSwitch > 700) {
          stepArtwork(state.turn > 0 ? -1 : 1);
          gestureTurnArmed = false;
          gestureLastSwitch = now;
        }
      }

      function applyGesture() {
        if (partMode || !gestureRunning || !window.MuseumGesture) return;
        handleGestureState(window.MuseumGesture.getState(), performance.now());
      }

      function onViewerPointerDown(event) {
        if (!viewerOpen) return;
        viewerPointers[event.pointerId] = { x: event.clientX, y: event.clientY };
        viewerStage.setPointerCapture(event.pointerId);
        var points = viewerPointerPositions();
        if (points.length >= 2) {
          viewerPinchStart = {
            distance: Math.max(1, viewerPointerDistance(points)),
            zoom: viewerZoom
          };
          viewerDragStart = null;
          viewerDidPan = true;
        } else if (viewerZoom > 1.001) {
          viewerDragStart = {
            x: event.clientX,
            y: event.clientY,
            panX: viewerPanX,
            panY: viewerPanY
          };
          viewerDidPan = false;
        }
        viewerStage.classList.toggle("dragging", !!viewerDragStart);
      }

      function onViewerPointerMove(event) {
        if (!viewerOpen || !viewerPointers[event.pointerId]) return;
        viewerPointers[event.pointerId] = { x: event.clientX, y: event.clientY };
        var points = viewerPointerPositions();
        if (points.length >= 2 && viewerPinchStart) {
          var distance = Math.max(1, viewerPointerDistance(points));
          setViewerZoom(viewerPinchStart.zoom * (distance / viewerPinchStart.distance), false);
          return;
        }
        if (!viewerDragStart) return;
        var dx = event.clientX - viewerDragStart.x;
        var dy = event.clientY - viewerDragStart.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) viewerDidPan = true;
        viewerPanX = viewerDragStart.panX + dx;
        viewerPanY = viewerDragStart.panY + dy;
        updateViewerTransform(false);
      }

      function onViewerPointerEnd(event) {
        if (!viewerPointers[event.pointerId]) return;
        delete viewerPointers[event.pointerId];
        if (viewerStage.hasPointerCapture(event.pointerId)) {
          viewerStage.releasePointerCapture(event.pointerId);
        }
        var points = viewerPointerPositions();
        if (points.length < 2) viewerPinchStart = null;
        if (points.length === 1 && viewerZoom > 1.001) {
          viewerDragStart = {
            x: points[0].x,
            y: points[0].y,
            panX: viewerPanX,
            panY: viewerPanY
          };
        } else if (!points.length) {
          viewerDragStart = null;
        }
        viewerStage.classList.toggle("dragging", !!viewerDragStart);
      }

      function bindEvents() {
        canvas.addEventListener("pointerdown", onPointerDown);
        canvas.addEventListener("pointermove", onPointerMove);
        canvas.addEventListener("pointerup", onPointerUp);
        canvas.addEventListener("pointercancel", onPointerUp);
        canvas.addEventListener("pointerleave", function () {
          if (!isDragging) {
            reticle.classList.remove("active");
            canvas.classList.remove("art-hover");
          }
        });

        window.addEventListener("keydown", function (event) {
          if (partMode) return;
          if (viewerOpen) {
            if (event.code === "Escape" || event.code === "KeyQ") {
              closeArtViewer();
            } else if (event.code === "ArrowLeft" || event.code === "ArrowRight") {
              stepArtwork(event.code === "ArrowLeft" ? -1 : 1);
              openArtViewer(activeExhibit);
            } else if (event.code === "Equal" || event.code === "NumpadAdd") {
              setViewerZoom(viewerZoom * 1.3, true);
            } else if (event.code === "Minus" || event.code === "NumpadSubtract") {
              setViewerZoom(viewerZoom / 1.3, true);
            } else if (event.code === "Digit0") {
              resetViewerZoom();
            } else {
              return;
            }
            event.preventDefault();
            return;
          }
          if (event.code === "Escape" || event.code === "KeyQ") {
            setPanel(false);
          } else if (event.code === "ArrowLeft") {
            stepArtwork(-1);
          } else if (event.code === "ArrowRight") {
            stepArtwork(1);
          } else if (event.code === "KeyE" || event.code === "Enter") {
            openPainting(activeExhibit);
          } else if (event.code === "KeyR") {
            resetView();
          } else {
            return;
          }
          if (event.code !== "KeyE" && event.code !== "KeyQ" && event.code !== "KeyR") {
            event.preventDefault();
          }
        });

        document.querySelectorAll(".painting-button").forEach(function (button) {
          button.addEventListener("click", function () {
            openPainting(button.getAttribute("data-exhibit"));
          });
        });

        document.getElementById("panel-close").addEventListener("click", function () {
          setPanel(false);
        });
        panelPreview.addEventListener("click", function () {
          openArtViewer(activeExhibit);
        });
        viewerClose.addEventListener("click", closeArtViewer);
        document.getElementById("viewer-zoom-out").addEventListener("click", function () {
          setViewerZoom(viewerZoom / 1.3, true);
        });
        document.getElementById("viewer-zoom-in").addEventListener("click", function () {
          setViewerZoom(viewerZoom * 1.3, true);
        });
        document.getElementById("viewer-fit").addEventListener("click", resetViewerZoom);
        viewerStage.addEventListener("pointerdown", onViewerPointerDown);
        viewerStage.addEventListener("pointermove", onViewerPointerMove);
        viewerStage.addEventListener("pointerup", onViewerPointerEnd);
        viewerStage.addEventListener("pointercancel", onViewerPointerEnd);
        viewerStage.addEventListener("wheel", function (event) {
          if (!viewerOpen) return;
          event.preventDefault();
          setViewerZoom(viewerZoom * Math.exp(-event.deltaY * 0.0014), false);
        }, { passive: false });
        viewerImage.addEventListener("click", function () {
          if (!viewerOpen) return;
          if (viewerDidPan) {
            viewerDidPan = false;
            return;
          }
          setViewerZoom(viewerZoom > 1.001 ? 1 : 2.4, true);
        });
        viewerImage.addEventListener("load", function () {
          if (viewerOpen) resetViewerZoom();
        });
        document.getElementById("reset-button").addEventListener("click", resetView);
        gestureButton.addEventListener("click", toggleGesture);

        window.addEventListener("resize", function () {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight, false);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          if (partMode) updatePartCamera(partDistance());
          if (viewerOpen) updateViewerTransform(false);
        });

        window.addEventListener("blur", function () {
          isDragging = false;
        });
      }

      function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.05);
        elapsed += dt;

        if (partMode) {
          if (isolatedRoot && !isDragging && !reducedMotion) {
            isolatedAngle += dt * 0.18;
            updatePartCamera(partDistance());
          }
        } else {
          updateMovement(dt);
          applyGesture();
          if (dust) {
            dust.rotation.y = Math.sin(elapsed * 0.06) * 0.03;
            dust.position.y = Math.sin(elapsed * 0.18) * 0.025;
          }
          paintingMeshes.forEach(function (mesh) {
            var isHovered = mesh.userData.exhibitId === hoveredId;
            var target = isHovered ? 1.026 : 1;
            mesh.scale.x += (target - mesh.scale.x) * 0.12;
            mesh.scale.y += (target - mesh.scale.y) * 0.12;
          });
        }

        renderer.render(scene, camera);
      }

      function markReady() {
        loading.classList.add("hidden");
        document.body.dataset.ready = "true";
        document.body.dataset.assetCount = String(Object.keys(templates).length);
        window.__HUANIAO_READY__ = true;
        var galleryApi = {
          mode: partMode ? "part" : "hall",
          ready: true,
          exhibits: PAINTINGS,
          loadedParts: Object.keys(templates),
          errors: [],
          paintingCount: paintingMeshes.length,
          parts: Object.keys(templates),
          paintings: PAINTINGS.map(function (painting) { return painting.id; }),
          reset: resetView,
          resetView: resetView,
          openPainting: openPainting,
          openArtViewer: openArtViewer,
          closeArtViewer: closeArtViewer,
          stepArtwork: stepArtwork,
          toggleGesture: toggleGesture,
          handleGestureState: handleGestureState,
          focusArtwork: function (id, openPanel) {
            if (openPanel === false) setActiveExhibit(id);
            else openPainting(id);
          },
          focusGalleryWall: resetView,
          focusDoorCheck: resetView,
          hideDetail: function () { setPanel(false); },
          getState: function () {
            return {
              activeExhibit: activeExhibit,
              detailOpen: panelOpen,
              viewerOpen: viewerOpen,
              viewerZoom: viewerZoom,
              gestureRunning: gestureRunning,
              camera: camera.position.toArray(),
              target: playerPosition.toArray(),
              yaw: playerYaw,
              pitch: playerPitch,
              distance: 0
            };
          },
          stats: function () {
            return {
              calls: renderer.info.render.calls,
              triangles: renderer.info.render.triangles,
              position: { x: playerPosition.x, y: 1.68, z: playerPosition.z },
              yaw: playerYaw,
              pitch: playerPitch,
              camera: camera.position.toArray(),
              activeExhibit: activeExhibit,
              panelOpen: panelOpen,
              viewerOpen: viewerOpen,
              viewerZoom: viewerZoom,
              gestureRunning: gestureRunning
            };
          }
        };
        window.HuaniaoGallery = galleryApi;
      }

      async function boot() {
        bindEvents();
        animate();

        try {
          if (partMode) {
            document.body.classList.add("part-mode");
            setProgress(22, "正在读取 " + PART_INFO[partParam].name);
            await loadPart(partParam);
            setProgress(78, "正在校验比例与落地原点");
            setupPartViewer(partParam);
            setProgress(100, "零件预览就绪");
          } else {
            setProgress(12, "正在铺设厅堂地面");
            setupMaterials();
            addArchitecture();
            setProgress(26, "正在接入室内柱网");

            for (var index = 0; index < PART_IDS.length; index += 1) {
              var id = PART_IDS[index];
              await loadPart(id);
              setProgress(30 + (index + 1) * 14, "正在接入 " + PART_INFO[id].name);
            }

            placeColumn(-6.62, 1.95);
            placeColumn(6.62, 1.95);
            placeColumn(-6.62, -2.5);
            placeColumn(6.62, -2.5);
            placeWindows();
            addSkylight();
            addPaintings();

            playerPosition.set(0, 0, 4.35);
            applyPlayerCamera(true);
            setProgress(100, "花鸟厅已就绪");
          }

          window.setTimeout(markReady, partMode ? 220 : 520);
        } catch (error) {
          console.error("[花鸟厅] 加载失败", error);
          loadingStatus.textContent = "展厅加载失败，请刷新重试";
          loadingStatus.classList.add("load-error");
          loadingBar.style.background = "#b95745";
          document.body.dataset.ready = "error";
        }
      }

      boot();
    })();
  </script>
</body>
